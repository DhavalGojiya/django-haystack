name: Test
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ruff: # https://docs.astral.sh/ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install --user ruff
      - run: ruff check --output-format=github

  test:
    runs-on: ubuntu-latest
    needs: ruff # Do not run the tests if linting fails.
    strategy:
      fail-fast: false
      matrix: # https://docs.djangoproject.com/en/stable/faq/install/#what-python-version-can-i-use-with-django
        django-version: ["4.2", "5.1", "5.2", "6.0"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        elastic-version: ["8.19.3"]
        include:
          - django-version: "5.2"
            python-version: "3.14"
            elastic-version: "8.19.3"
          - django-version: "5.2"
            python-version: "3.14t"
            elastic-version: "8.19.3"
          - django-version: "6.0"
            python-version: "3.14"
            elastic-version: "8.19.3"
          - django-version: "6.0"
            python-version: "3.14t"
            elastic-version: "8.19.3"
        exclude:
          - django-version: "4.2"
            python-version: "3.13"
          - django-version: "5.1"
            python-version: "3.9"
          - django-version: "5.2"
            python-version: "3.9"
          - django-version: "6.0"
            python-version: "3.9"
          - django-version: "6.0"
            python-version: "3.10"
          - django-version: "6.0"
            python-version: "3.11"
    services:
      solr:
        image: solr:6
        ports:
          - 9001:8983
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install --no-install-recommends -y gdal-bin

      - name: Setup solr test server in Docker
        run: bash test_haystack/solr_tests/server/setup-solr-test-server-in-docker.sh

      - name: Start Elasticsearch
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 120
        env:
          ELASTIC_VERSION: ${{ matrix.elastic-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # ``~=X.Y.0`` tracks the latest patch release of the series rather
          # than pinning to its initial release.
          pip install "django~=${{ matrix.django-version }}.0" "elasticsearch==${{ matrix.elastic-version }}"
          pip install --editable ".[testing]"

      - name: Run test
        run: |
          python test_haystack/solr_tests/server/wait-for-solr
          coverage run test_haystack/run_tests.py
